# Codemagic builds for Shape Words: Learn English
# Before the first build, in Codemagic:
#  - iOS:   uses the App Store Connect API key "codemagic_api_key" (same as Pati Pals / Jigsaw).
#           App Store profile: shapewords_appstore (fetched in Code signing identities).
#  - Android: Code signing identities > Android keystores: create/upload a NEW keystore for this app
#           with the reference name  shape_words_keystore  (keep a copy of the file and passwords safe!).
workflows:
  ios-release:
    name: Shape Words – iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.muratkassasgames.shapewords
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the game into the iOS project
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set build number
        script: cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Build the .ipa
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-metadata:
    name: Shape Words – App Store listing (texts, screenshots, price)
    max_build_duration: 30
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key
    scripts:
      - name: Fill App Store Connect listing
        script: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
          python3 tools/asc_metadata.py

  android-release:
    name: Shape Words – Android (.aab)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - shape_words_keystore
      node: 22
      java: 21
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy the game into the Android project
        script: npx cap sync android
      - name: Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build the .aab
        script: cd android && chmod +x gradlew && ./gradlew bundleRelease -PversionCode=$BUILD_NUMBER
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
